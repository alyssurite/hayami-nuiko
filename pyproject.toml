[tool.poetry]
name = "Hayami Nuiko Telegram bot"
version = "6.0"
description = "This is a bot for beautifying pixiv and twitter links in order to get clean links without any URI query garbage."
authors = ["Alyss Mesh <alyssurite@yandex.ru>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
python-telegram-bot = {version = "^22.4", extras = ["job-queue", "webhooks"]}
pyrogram = "^2.0.106"
tgcrypto = "^1.2.5"
uvloop = {version = "^0.21.0", platform = "linux"}
sqlalchemy = "^2.0.43"
alembic = "^1.16.5"
tzdata = "^2025.2"
python-magic = {version = "^0.4.27", platform = "linux"}
python-magic-bin = {version = "^0.4.14", platform = "win32"}
tenacity = "^9.1.2"
beautifulsoup4 = "^4.13.5"
pillow = "^11.3.0"
logtail-python = "^0.3.4"
pixivpy-async = "^1.2.14"
aiocache = "^0.12.3"
orjson = "^3.11.3"
python-dateutil = "^2.9.0.post0"
gallery-dl = "^1.30.7"
psycopg2-binary = "^2.9.10"
fastapi = "^0.117.1"
uvicorn = "^0.36.0"
dataclasses-json = "^0.6.7"
pydantic-settings = "^2.11.0"
structlog = "^25.4.0"

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.3.0"

[tool.isort]
profile = "black"
skip = ["alembic.ini"]
skip_glob = [".*/", ".*", "log/", "*.log"]
line_length = 90
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
lines_between_types = 1

[tool.black]
line-length = 90
include = '\.pyi?$'


[tool.ruff]
lint.select = ["E", "F", "B"]
lint.ignore = []

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]
lint.per-file-ignores = {}

# Same as Black.
line-length = 90

# Allow unused variables when underscore-prefixed.
lint.dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Assume Python 3.12.
target-version = "py312"
